# Local development stack (SPEC.md §23): PostgreSQL, Redis, MinIO (S3-compatible).
# Usage: `docker compose up -d`, then copy .env.example -> .env and fill in values
# matching the services below (defaults are shown in each environment block).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: posplus
      POSTGRES_PASSWORD: posplus
      POSTGRES_DB: posplus
    ports:
      - "5433:5432" # host 5433 avoids clashing with a locally installed Postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posplus -d posplus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: posplus
      MINIO_ROOT_PASSWORD: posplus-posplus
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the app bucket once MinIO is healthy.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 posplus posplus-posplus &&
      mc mb --ignore-existing local/posplus-documents &&
      exit 0
      "

volumes:
  postgres-data:
  minio-data:
